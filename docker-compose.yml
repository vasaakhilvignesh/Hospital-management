services:
  # Placeholder for MySQL and core infrastructure containers in future phases
  mysql:
    image: mysql:8.0
    container_name: hms-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
